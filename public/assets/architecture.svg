<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="420" rx="16" fill="#0d1117" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  
  <text x="450" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#f3f4f6">
    ARCHITECTURE DU SYSTÈME NO-DB &amp; AGENT IA
  </text>

  <!-- Flow Boxes -->
  <!-- Box 1: Client UI -->
  <g transform="translate(40, 90)">
    <rect width="220" height="280" rx="12" fill="rgba(139, 92, 246, 0.08)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="110" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#c084fc">1. Client / Frontend</text>
    <rect x="20" y="60" width="180" height="50" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.1)" />
    <text x="110" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e5e7eb">Glassmorphism UI</text>
    <rect x="20" y="125" width="180" height="50" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.1)" />
    <text x="110" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e5e7eb">IndexedDB Vector Cache</text>
    <rect x="20" y="190" width="180" height="60" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.1)" />
    <text x="110" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">Recherche Sémantique</text>
    <text x="110" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">0ms Latence Local</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 260 230 L 330 230" />
  </g>
  <text x="295" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">SSE Stream</text>

  <!-- Box 2: Next.js API & Agent -->
  <g transform="translate(340, 90)">
    <rect width="220" height="280" rx="12" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="110" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#38bdf8">2. Agent IA &amp; Route API</text>
    <rect x="20" y="60" width="180" height="50" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.1)" />
    <text x="110" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e5e7eb">Next.js App Router</text>
    <rect x="20" y="125" width="180" height="50" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.1)" />
    <text x="110" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e5e7eb">Gemini / Groq LLM</text>
    <rect x="20" y="190" width="180" height="60" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.1)" />
    <text x="110" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">Function Calling</text>
    <text x="110" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c084fc">Tool Dispatcher</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g stroke="#f472b6" stroke-width="2">
    <path d="M 560 230 L 630 230" />
  </g>
  <text x="595" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f472b6">Async Fetch</text>

  <!-- Box 3: Stealth Scraper Pipeline -->
  <g transform="translate(640, 90)">
    <rect width="220" height="280" rx="12" fill="rgba(236, 72, 153, 0.08)" stroke="#ec4899" stroke-width="1.5" />
    <text x="110" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f472b6">3. Stealth Scrapers</text>
    <rect x="20" y="60" width="180" height="50" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.1)" />
    <text x="110" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e5e7eb">IMDb / SensCritique</text>
    <rect x="20" y="125" width="180" height="50" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.1)" />
    <text x="110" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e5e7eb">AniList / MyAnimeList</text>
    <rect x="20" y="190" width="180" height="60" rx="8" fill="#161b22" stroke="rgba(255,255,255,0.1)" />
    <text x="110" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">BD Gest / BDTheque</text>
    <text x="110" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">Polite Scraping (500ms)</text>
  </g>
</svg>
